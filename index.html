<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gastos de Tarjetas</title>
<meta name="theme-color" content="#0b0c10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('gastosTarjetas.tema') || 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ===== tokens: dark is the default, light is opt-in from the menu ===== */
:root {
  color-scheme: dark;
  --bg: #0b0c10; --surface: #15161c; --surface-2: #1e2028; --surface-3: #282a34; --border: #272933; --border-strong: #3a3d4a;
  --text: #f2f3f7; --muted: #a0a5b5; --accent: #a99dff; --accent-strong: #6a5af0; --accent-soft: #231f42;
  --me: #4cdba0; --me-soft: #12291f; --warn: #f5b84d; --warn-soft: #33270f; --danger: #ff8585; --danger-soft: #3a1a1e;
  --changed: #2e2813; --tip: #23252e; --shadow: 0 1px 0 rgba(255,255,255,.03) inset;
  --visa-bg: #1d2a4a; --visa: #a9c2ff; --master-bg: #3a2616; --master: #ffb27d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s-other:#77776f; --grid:#25272f;
  --r-lg: 16px; --r-md: 11px; --r-sm: 8px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f5f8; --surface: #ffffff; --surface-2: #f0f1f5; --surface-3: #e6e8ee; --border: #e3e5eb; --border-strong: #cdd0da;
  --text: #171a23; --muted: #5d6474; --accent: #5546d6; --accent-strong: #5a4ae0; --accent-soft: #ecebfd;
  --me: #0b7d55; --me-soft: #e2f5ed; --warn: #955a00; --warn-soft: #fdf1dc; --danger: #c02f35; --danger-soft: #fde8e8;
  --changed: #fff7d6; --tip: #ffffff; --shadow: 0 1px 2px rgba(20,30,50,.05), 0 6px 20px rgba(20,30,50,.04);
  --visa-bg: #e6edfd; --visa: #1d3fa0; --master-bg: #fdeee3; --master: #974209;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s-other:#9a9a96; --grid:#e8e9ee;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; font-feature-settings: "cv11", "ss03"; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
h1, h2, h3 { letter-spacing: -.015em; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 200; background: var(--accent-strong); color: #fff; padding: 8px 14px; border-radius: var(--r-sm); }
.skip:focus { top: 10px; }

/* ===== header ===== */
.sticky { position: sticky; top: 0; z-index: 20; }
header.top { background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
  padding: 12px 28px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; margin-right: 12px; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent-strong); color: #fff; display: grid; place-items: center; }
header.top .sp { flex: 1; }
nav.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
nav.tabs button { border: 0; background: none; color: var(--muted); padding: 7px 14px; border-radius: 9px; white-space: nowrap; font-weight: 500; }
nav.tabs button:hover { background: var(--surface-2); color: var(--text); }
nav.tabs button.on { background: var(--surface-3); color: var(--text); font-weight: 600; }
nav.tabs .ic, nav.tabs .sm { display: none; }
.monthsel { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); }
.monthsel[hidden] { display: none; }
.monthsel select { border: 0; background: transparent; font-weight: 600; padding: 8px 4px; min-width: 150px; text-align: center; text-align-last: center; }
.monthsel button { border: 0; background: none; padding: 8px; color: var(--muted); }
.monthsel button:disabled { opacity: .3; }
.estado .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--me); flex: none; }
.estado.ocupado .dot { background: var(--warn); }
.estado.off .dot { background: var(--muted); }
.menu { position: relative; }
.menupop { position: absolute; right: 0; top: calc(100% + 8px); min-width: 250px; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: var(--r-md);
  padding: 6px; box-shadow: 0 16px 40px rgba(0,0,0,.45); z-index: 40; }
.menupop[hidden] { display: none; }
.menupop button { width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: var(--r-sm); text-align: left; justify-content: flex-start; }
.menupop button:hover { background: var(--surface-3); }
.menupop button[hidden] { display: none; }

/* ===== controls ===== */
button, .btn { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 8px 14px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
button:hover, .btn:hover { background: var(--surface-2); }
button.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; font-weight: 600; }
button.primary:hover { filter: brightness(1.1); background: var(--accent-strong); }
button.small { padding: 4px 10px; font-size: 13px; border-radius: var(--r-sm); }
button.ghost { border-color: transparent; background: transparent; }
button.ghost:hover { background: var(--surface-2); }
button.danger { color: var(--danger); }
button.iconbtn { padding: 8px; }
button:disabled { opacity: .45; cursor: not-allowed; }
.warnbtn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 600; }
select, input[type=text], input[type=number], input[type=date] { font: inherit; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); color: var(--text); }
select:hover, input:hover { border-color: var(--border-strong); }
input[type=checkbox] { accent-color: var(--accent-strong); width: 16px; height: 16px; margin: 0; }
select.sincat { color: var(--muted); border-style: dashed; }

/* ===== layout ===== */
main { padding: 24px 28px 64px; max-width: 1360px; margin: 0 auto; }
.pagehead { margin-bottom: 18px; }
.pagehead h1 { font-size: 26px; font-weight: 650; margin: 0; }
.pagehead p { margin: 2px 0 0; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 20px; margin-bottom: 18px; }
.card h2 { font-size: 16px; margin: 0 0 14px; font-weight: 600; }
.card h2 .sub { color: var(--muted); font-weight: 400; font-size: 13.5px; margin-left: 6px; letter-spacing: 0; }
.seccion { font-size: 19px; font-weight: 650; margin: 28px 0 14px; }
.split2 { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
.split2 .rail { display: grid; gap: 18px; }
.split2 .rail .card { margin: 0; }
.muted { color: var(--muted); }
.ok { color: var(--me); } .bad { color: var(--warn); }
.paid { color: var(--me); font-weight: 600; }
.neg { color: var(--me); }

/* ===== KPIs ===== */
.hero { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; min-width: 0; }
.stat .lbl { color: var(--muted); font-size: 13.5px; font-weight: 500; }
.stat .val { font-size: 30px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.2; }
.stat .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
.stat.me { border-color: var(--accent-strong); }
.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; font-size: 13px; }
.delta.sube { color: var(--warn); } .delta.baja { color: var(--me); }
.spark { display: block; width: 100%; height: 34px; margin-top: 10px; }

/* ===== badges, tags, bars ===== */
.tag { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 99px; background: var(--surface-3); color: var(--muted); white-space: nowrap; }
.tag.visa { background: var(--visa-bg); color: var(--visa); } .tag.mastercard { background: var(--master-bg); color: var(--master); }
.tag.mem { background: var(--accent-soft); color: var(--accent); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px 2px 6px; border-radius: 99px; white-space: nowrap; }
.badge .ic { width: 13px; height: 13px; stroke-width: 2.4; }
.badge.ok { background: var(--me-soft); color: var(--me); }
.badge.parcial { background: var(--warn-soft); color: var(--warn); }
.badge.pend { background: var(--surface-3); color: var(--text); }
.bar { height: 6px; background: var(--surface-3); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.bar > i { display: block; height: 100%; background: var(--accent-strong); border-radius: 99px; }
.bar.lleno > i { background: var(--me); }

/* ===== resumen: who owes me, due dates ===== */
.deudor { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 11px 0; border-bottom: 1px solid var(--border); border-radius: 0; }
.deudor:hover { background: none; }
.deudor:hover .dnom { text-decoration: underline; }
.deudor:last-child { border-bottom: 0; padding-bottom: 0; }
.deudor .dtop { display: flex; align-items: center; gap: 8px; }
.deudor .dnom { font-weight: 600; }
.deudor .dfalta { margin-left: auto; font-weight: 650; font-variant-numeric: tabular-nums; }
.deudor .dsub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.vence { padding: 12px 0; border-bottom: 1px solid var(--border); }
.vence:first-of-type { padding-top: 0; }
.vence:last-child { border-bottom: 0; padding-bottom: 0; }
.vence .vtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.vence .vmonto { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.015em; margin-top: 4px; }
.vence .vsub { color: var(--muted); font-size: 13px; }
details.card > summary { cursor: pointer; font-weight: 600; }
details.card[open] > summary { margin-bottom: 14px; }
.cellbtn { border: 0; background: none; padding: 0; font-variant-numeric: tabular-nums; border-radius: 4px; }
.cellbtn:hover { background: none; text-decoration: underline; }

/* ===== tables ===== */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
th { font-size: 12.5px; color: var(--muted); font-weight: 500; background: var(--surface); position: sticky; top: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
td.n, th.n { text-align: right; }
th.cur, td.cur { background: var(--accent-soft) !important; }
tr.me td { font-weight: 600; }
tr.tot td { font-weight: 650; border-top: 1px solid var(--border-strong); border-bottom: 0; }
tr.changed td { background: var(--changed); }
tr.excl td.desc, tr.excl td.n { opacity: .5; text-decoration: line-through; }
td.desc { white-space: normal; min-width: 260px; }
td.pc, th.pc { padding-left: 4px; padding-right: 0; width: 1%; }
.pencil { padding: 4px 6px; color: var(--muted); }
tr:hover .pencil, .pencil:focus-visible { color: var(--text); }
.pencil .ic { width: 16px; height: 16px; }
.nota { margin-top: 3px; font-size: 13px; color: var(--warn); cursor: pointer; white-space: pre-wrap; }
.nota:hover { text-decoration: underline; }
.split { display: flex; flex-direction: column; gap: 1px; margin-top: 4px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.split:hover { color: var(--accent); }
.split .yo { color: var(--text); font-weight: 600; }
select.who { min-width: 120px; }
select.cat { max-width: 200px; }
td select.who, td select.cat { background: transparent; border-color: transparent; }
td select.who:hover, td select.cat:hover, td select.who:focus, td select.cat:focus { background: var(--surface-2); border-color: var(--border-strong); }
td select.sincat { border-color: var(--border); border-style: dashed; }

/* ===== month: statements strip and people ===== */
.info { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.info .chip { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 8px 12px; font-size: 13.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.info .chip .ic { width: 15px; height: 15px; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-bottom: 18px; }
.person { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; cursor: pointer; box-shadow: var(--shadow); min-width: 0; }
.person:hover { border-color: var(--border-strong); }
.person.on { outline: 2px solid var(--accent); }
.person.me { border-color: var(--accent-strong); }
.person .nm { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.person .nm .sp { flex: 1; }
.person .nm .ghost { padding: 4px; color: var(--muted); }
.person .nm .ic { width: 16px; height: 16px; }
.person .nm .badge .ic { width: 13px; height: 13px; }
.person .amt { font-size: 24px; font-weight: 650; margin-top: 4px; letter-spacing: -.015em; font-variant-numeric: tabular-nums; }
.person .portj { margin-top: 10px; display: grid; gap: 6px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.person .portj > div { display: flex; justify-content: space-between; align-items: center; gap: 8px; white-space: nowrap; }
.person label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.person .portj > .pagos { display: block; white-space: normal; margin: -3px 0 2px 22px; color: var(--muted); font-size: 12.5px; }
.person .portj > .pagos:hover { text-decoration: underline; }
.person .row { margin-top: 8px; font-size: 13px; color: var(--muted); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar .sp { flex: 1; }

/* ===== states ===== */
.empty { text-align: center; padding: 56px 24px; color: var(--muted); }
.empty h2 { color: var(--text); font-size: 21px; margin: 12px 0 6px; }
.empty p { margin: 0 auto 18px; max-width: 460px; }
.empty .ic.grande { width: 40px; height: 40px; color: var(--accent); stroke-width: 1.4; }
.drop.over { outline: 2px solid var(--accent); }
body.dragging::after { content: "Soltá los PDF acá"; position: fixed; inset: 14px; border: 2px dashed var(--accent); border-radius: 18px; background: color-mix(in srgb, var(--bg) 82%, transparent);
  z-index: 150; display: grid; place-items: center; font-size: 22px; font-weight: 600; pointer-events: none; }
.banner { background: var(--accent-soft); border-radius: var(--r-md); padding: 10px 14px; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); }
.toast { position: fixed; bottom: 22px; right: 22px; max-width: 440px; background: var(--tip); color: var(--text); border: 1px solid var(--border-strong); padding: 12px 16px;
  border-radius: var(--r-md); box-shadow: 0 12px 34px rgba(0,0,0,.4); z-index: 120; white-space: pre-line; display: flex; gap: 10px; align-items: flex-start; }
.toast .ic { margin-top: 2px; }
.toast.ok .ic { color: var(--me); } .toast.err .ic { color: var(--danger); }
.toast.err { border-color: var(--danger); }
.spin { width: 18px; height: 18px; flex: none; margin-top: 2px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.modal-bg { position: fixed; inset: 0; background: rgba(5,6,10,.68); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-lg); padding: 24px; width: 100%; max-width: 720px; box-shadow: 0 24px 70px rgba(0,0,0,.5); }
.modal:focus { outline: none; }
.modal h3 { margin: 0 0 4px; font-size: 19px; font-weight: 650; }
.modal h4 { margin: 20px 0 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
.modal .grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; }

/* ===== charts ===== */
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.charts .card { margin-bottom: 0; }
.chartbox { position: relative; height: 280px; }
.chartbox.tall { height: 340px; }
.charts + .card { margin-top: 18px; }

/* ===== budget grid and phone lists ===== */
table.presu input.celda { width: 82px; text-align: right; padding: 4px 6px; font-variant-numeric: tabular-nums; border-color: transparent; background: transparent; }
table.presu input.celda:hover, table.presu input.celda:focus { border-color: var(--border); background: var(--surface); }
table.presu input.celda.esauto::placeholder { color: var(--accent); opacity: 1; font-style: italic; }
table.presu input.celda.override { color: var(--warn); font-weight: 600; }
table.presu input.nom { border-color: transparent; background: transparent; width: 150px; font-weight: 500; }
table.presu input.nom:hover, table.presu input.nom:focus { border-color: var(--border); background: var(--surface); }
table.presu td, table.presu th { padding: 3px 4px; font-size: 13px; }
table.presu input { font-size: 13px; }
table.presu .concepto { position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.presu .fila { display: flex; align-items: center; }
table.presu .fila .ghost { opacity: .35; padding: 2px 5px; }
table.presu tr:hover .fila .ghost { opacity: 1; }
select.catfila { display: block; font-size: 11.5px; padding: 1px 4px; margin-top: 2px; max-width: 100%; }
table.presu select.catfila { width: 150px; margin-left: 8px; }
.lnom select.catfila { font-size: 14px; margin-top: 4px; }
table.presu tr.sec td { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding-top: 16px; border-bottom: 2px solid var(--border); }
table.presu tr.sub td { font-weight: 600; background: var(--surface-2); }
table.presu tr.sub td:first-child, table.presu tr.queda td:first-child { position: sticky; left: 0; z-index: 1; }
table.presu tr.queda td { font-weight: 700; font-size: 15px; border-top: 2px solid var(--text); background: var(--surface); }
table.presu tr.addrow td { border-bottom: none; }
table.presu .seclbl, table.presu tr.addrow button { position: sticky; left: 8px; }
table.presu th .ghost { padding: 0 4px; font-size: 12px; }
/* phone: lists instead of wide tables */
.mnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.mnav b { font-size: 17px; }
.mnav button { font-size: 20px; padding: 2px 18px; }
.lsec { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 16px 0 6px; border-bottom: 2px solid var(--border); }
.lsec:first-child { padding-top: 0; }
.lrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
.lrow .lnom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow input.lval { width: 130px; text-align: right; font-size: 16px; font-variant-numeric: tabular-nums; }
.lrow input.lval.esauto::placeholder { color: var(--accent); opacity: 1; font-style: italic; }
.lrow input.lval.override { color: var(--warn); font-weight: 600; }
.lrow.ltot { font-weight: 600; border-bottom: none; }
.lrow.lqueda { font-weight: 700; font-size: 18px; border-top: 2px solid var(--text); border-bottom: none; margin-top: 10px; padding-top: 10px; }
.ladd { margin: 6px 0 2px; }
.mov { border-bottom: 1px solid var(--border); padding: 10px 0; }
.mov.changed { background: var(--changed); margin: 0 -14px; padding: 10px 14px; }
.mov.excl .mtop { opacity: .5; text-decoration: line-through; }
.mtop { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }

<script>
// ===== PARSER (shared between the web page and the node test) =====
const MESES = {ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12};

function parseNum(s) {
  return parseFloat(s.replace(/\./g, '').replace(',', '.'));
}
function parseFecha(s) {
  const m = s.match(/^(\d{1,2})-([A-Za-zé]{3})-(\d{2})$/);
  if (!m) return null;
  const mes = MESES[m[2].toLowerCase()];
  if (!mes) return null;
  return { d: +m[1], m: mes, y: 2000 + +m[3] };
}
function fechaISO(f) {
  return f.y + '-' + String(f.m).padStart(2, '0') + '-' + String(f.d).padStart(2, '0');
}

// Pages -> lines. items: [{str, x, y, w}] in pdf units (y grows upward).
async function extractLines(pdf) {
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items
      .filter(it => it.str && it.str.trim() !== '')
      .map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5], w: it.width }));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    let cur = null;
    for (const it of items) {
      if (cur && Math.abs(cur.y - it.y) <= 2.5) cur.items.push(it);
      else { cur = { y: it.y, page: p, items: [it] }; lines.push(cur); }
    }
  }
  for (const l of lines) {
    l.items.sort((a, b) => a.x - b.x);
    l.text = l.items.map(i => i.str.trim()).join(' ').replace(/\s+/g, ' ').trim();
  }
  return lines;
}

// The card brand comes from the account line ("Visa Signature cuenta ..."), not from any
// mention in the legal text / promos, which can name the other brand.
function detectarTarjeta(texts) {
  const marca = s => /mastercard/i.test(s) ? 'Mastercard' : /\bvisa\b/i.test(s) ? 'Visa' : null;
  const pruebas = [
    t => /\bcuenta\s+\d+/i.test(t),                 // "Visa Signature cuenta 0267852581 CONSOLIDADO"
    t => /^Resumen con\b/i.test(t),                  // "Resumen con Visa"
    t => /^Tarjeta de cr[eé ]+dito (visa|mastercard)/i.test(t)
  ];
  for (const p of pruebas) {
    for (const t of texts) if (p(t) && marca(t)) return marca(t);
  }
  // Fallback: whichever brand is mentioned more often.
  const all = texts.join('\n');
  const nv = (all.match(/\bvisa\b/gi) || []).length, nm = (all.match(/mastercard/gi) || []).length;
  return nv || nm ? (nm > nv ? 'Mastercard' : 'Visa') : 'Tarjeta';
}

// Statement parser for BBVA Visa / Mastercard "Resumen" PDFs.
function parseResumen(lines) {
  const texts = lines.map(l => l.text);
  const all = texts.join('\n');
  const res = {
    tarjeta: detectarTarjeta(texts),
    cierre: null, vencimiento: null, saldoPesos: null, saldoUSD: null,
    titulares: [],   // [{nombre, totalPesos, totalUSD}]
    gastos: [],      // [{fecha, desc, cuota, cupon, titular, pesos, usd, seccion}]
    warnings: []
  };
  // Header: "CIERRE ACTUAL VENCIMIENTO ACTUAL SALDO ACTUAL $ SALDO ACTUAL U$S ..." followed by the values.
  const hi = texts.findIndex(t => /CIERRE ACTUAL/i.test(t));
  if (hi >= 0) {
    const blob = texts.slice(hi, hi + 14).join(' ');
    const after = blob.slice(blob.search(/CIERRE ACTUAL/i));
    const fechas = after.match(/\d{2}-[A-Za-z]{3}-\d{2}/g) || [];
    if (fechas[0]) res.cierre = parseFecha(fechas[0]);
    if (fechas[1]) res.vencimiento = parseFecha(fechas[1]);
    const desdeFecha = fechas[1] ? after.slice(after.indexOf(fechas[1]) + fechas[1].length) : '';
    const montos = desdeFecha.match(/-?[\d.]+,\d{2}/g) || [];
    if (montos[0]) res.saldoPesos = parseNum(montos[0]);
    if (montos[1]) res.saldoUSD = parseNum(montos[1]);
  }

  // Column x (right edge) for PESOS / DÓLARES, from the detail header.
  let colPesos = null, colUSD = null;
  let seccion = null;   // null | {tipo:'consumos', titular} | {tipo:'impuestos'} | {tipo:'pagos'}
  const amountRe = /^-?[\d.]+,\d{2}$/;

  for (const l of lines) {
    const t = l.text;
    if (/^FECHA DESCRIPCI/i.test(t)) {
      for (const it of l.items) {
        const s = it.str.trim().toUpperCase();
        if (s === 'PESOS' || s.endsWith(' PESOS')) colPesos = it.x + it.w;
        if (s.endsWith('LARES')) colUSD = it.x + it.w;   // "DÓLARES" may come split as D / Ó / LARES
      }
      continue;
    }
    let m;
    if (/^Sus pagos y ajustes/i.test(t)) { seccion = { tipo: 'pagos' }; continue; }
    if ((m = t.match(/^Consumos (.+)$/i)) && !/^Consumos de/i.test(t)) { seccion = { tipo: 'consumos', titular: m[1].trim().toUpperCase() }; continue; }
    if (/^Impuestos, cargos e intereses/i.test(t)) { seccion = { tipo: 'impuestos' }; continue; }
    if ((m = t.match(/^TOTAL CONSUMOS DE (.+?) (-?[\d.]+,\d{2}) (-?[\d.]+,\d{2})$/i))) {
      if (seccion && seccion.tipo === 'consumos') {
        res.titulares.push({ nombre: m[1].trim().toUpperCase(), totalPesos: parseNum(m[2]), totalUSD: parseNum(m[3]) });
      }
      seccion = null; continue;
    }
    if (/^SALDO ACTUAL/i.test(t) || /^Legales y avisos/i.test(t)) { seccion = null; continue; }
    if (!seccion || seccion.tipo === 'pagos') continue;

    const fm = t.match(/^(\d{2}-[A-Za-z]{3}-\d{2}) (.+)$/);
    if (!fm) continue;
    const fecha = parseFecha(fm[1]);
    if (!fecha) continue;

    // Last amount token = the charged amount; find which column it sits in.
    const toks = fm[2].split(' ');
    const last = toks[toks.length - 1];
    if (!amountRe.test(last)) continue;
    const monto = parseNum(last);
    let esUSD = null;
    const lastItem = [...l.items].reverse().find(i => i.str.trim().endsWith(last));
    if (lastItem && colPesos != null && colUSD != null) {
      const r = lastItem.x + lastItem.w;
      esUSD = Math.abs(r - colUSD) < Math.abs(r - colPesos);
    }
    if (esUSD === null) esUSD = /\bUSD\b/.test(fm[2]);
    toks.pop();
    let body = toks.join(' ');
    let cupon = '';
    if (seccion.tipo === 'consumos') {
      const cm = body.match(/ (\S+)$/);
      if (cm) { cupon = cm[1]; body = body.slice(0, -cm[0].length); }
    }
    let cuota = '';
    const qm = body.match(/\bC\.(\d{2})\/(\d{2})\b/);
    if (qm) { cuota = qm[1] + '/' + qm[2]; body = body.replace(qm[0], ' '); }
    body = body.replace(/\bUSD\s+[\d.]+,\d{2}/, m => m).replace(/\s+/g, ' ').trim();

    res.gastos.push({
      fecha: fechaISO(fecha), desc: body, cuota, cupon,
      titular: seccion.tipo === 'consumos' ? seccion.titular : 'IMPUESTOS',
      seccion: seccion.tipo,
      pesos: esUSD ? 0 : monto, usd: esUSD ? monto : 0,
      original: t
    });
  }

  // Cross-check: sum of parsed lines vs. statement totals per titular block.
  const sum = {};
  for (const g of res.gastos) {
    if (g.seccion !== 'consumos') continue;
    const k = g.titular; sum[k] = sum[k] || { p: 0, u: 0 };
    sum[k].p += g.pesos; sum[k].u += g.usd;
  }
  const tot = {};
  for (const tt of res.titulares) {
    tot[tt.nombre] = tot[tt.nombre] || { p: 0, u: 0 };
    tot[tt.nombre].p += tt.totalPesos; tot[tt.nombre].u += tt.totalUSD;
  }
  for (const k of Object.keys(tot)) {
    const s = sum[k] || { p: 0, u: 0 };
    if (Math.abs(s.p - tot[k].p) > 0.05 || Math.abs(s.u - tot[k].u) > 0.05) {
      res.warnings.push(`Los gastos leídos de ${k} (${s.p.toFixed(2)} / USD ${s.u.toFixed(2)}) no coinciden con el total del resumen (${tot[k].p.toFixed(2)} / USD ${tot[k].u.toFixed(2)}).`);
    }
  }
  if (!res.vencimiento) res.warnings.push('No encontré la fecha de vencimiento.');
  if (!res.gastos.length) res.warnings.push('No encontré gastos. ¿Es un resumen de BBVA?');
  return res;
}

if (typeof module !== 'undefined') module.exports = { extractLines, parseResumen };

</script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ===== STATE =====
const STORE = 'gastosTarjetas.v1';
const NOMBRES_MES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const NO_CONTAR = '_none';
const DIVIDIDO = '_split';

function defaultState() {
  return {
    principal: 'eze',
    dolar: 1450,
    personas: [
      { id: 'eze', nombre: 'Eze' }, { id: 'euge', nombre: 'Euge' }, { id: 'gi', nombre: 'Gi' },
      { id: 'ari', nombre: 'Ari' }, { id: 'dani', nombre: 'Dani' }, { id: 'nadia', nombre: 'Nadia' }
    ],
    // titular as it appears in the PDF (first + last word) -> persona id
    claves: {},
    meses: {},   // 'YYYY-MM' -> { dolar, resumenes: {Visa: meta, Mastercard: meta}, gastos: [], pagos: {} }
    reglas: {},  // installment key -> persona id (remembered reassignments)
    notas: {}    // installment key -> note (follows the purchase into next months)
  };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.meses) return s; } catch (e) {}
  return defaultState();
}
let state = load();
let ui = { tab: 'resumen', mes: null, filtroPersona: '', filtroTarjeta: '', buscar: '' };
const SECCIONES_APP = [['resumen', 'Resumen', 'home'], ['mov', 'Movimientos', 'list'], ['stats', 'Estadísticas', 'chart'], ['presu', 'Ingresos y gastos', 'wallet', 'Ingresos']];
function save() {
  state.actualizado = new Date().toISOString();
  try { localStorage.setItem(STORE, JSON.stringify(state)); }
  catch (e) { toast('⚠ No pude guardar en el navegador: ' + e.message); }
  programarEscritura();
  programarDrive();
}

// ===== ARCHIVO DE DATOS (copy of everything in a .json the user picks) =====
const fsSoportado = 'showSaveFilePicker' in window && 'indexedDB' in window;
const archivo = { handle: null, estado: 'none', ultimo: null };   // estado: none | permiso | ok
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('gastosTarjetas', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbOp(fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite'); const st = tx.objectStore('kv');
    const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
  });
}
async function initArchivo() {
  if (!fsSoportado) return;
  try {
    const h = await idbOp(st => st.get('handle'));
    if (!h) return;
    archivo.handle = h;
    if (await h.queryPermission({ mode: 'readwrite' }) === 'granted') await conectarArchivo();
    else archivo.estado = 'permiso';
  } catch (e) { console.warn(e); }
  renderArchivo(); render();
}
// Read the file: the newest copy (file vs. browser) wins, then keep the file in sync.
async function conectarArchivo() {
  const txt = await (await archivo.handle.getFile()).text();
  let data = null;
  try { data = txt.trim() ? JSON.parse(txt) : null; } catch (e) {}
  const localVacio = !Object.keys(state.meses).length;
  if (data && data.meses && data.personas && (localVacio || (data.actualizado || '') > (state.actualizado || ''))) {
    state = data;
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
    if (Object.keys(state.meses).length) toast('📂 Cargué tus datos desde ' + archivo.handle.name);
  }
  archivo.estado = 'ok';
  await escribirArchivo();
  render();
}
let escrituraTimer;
function programarEscritura() {
  if (archivo.estado !== 'ok') return;
  clearTimeout(escrituraTimer);
  escrituraTimer = setTimeout(escribirArchivo, 400);
}
async function escribirArchivo() {
  if (!archivo.handle || archivo.estado !== 'ok') return;
  try {
    const w = await archivo.handle.createWritable();
    await w.write(JSON.stringify(state, null, 1)); await w.close();
    archivo.ultimo = new Date();
  } catch (e) {
    console.warn(e); archivo.estado = 'permiso';
    toast('⚠ No pude guardar en el archivo. Tocá "Reconectar archivo" arriba.');
  }
  renderArchivo();
}
const tiposJSON = [{ description: 'Datos de gastos', accept: { 'application/json': ['.json'] } }];
async function crearArchivo() {
  try {
    const h = await window.showSaveFilePicker({ suggestedName: 'gastos-tarjetas-datos.json', types: tiposJSON });
    await usarHandle(h);
  } catch (e) { if (e.name !== 'AbortError') toast('❌ ' + e.message); }
}
async function abrirArchivo() {
  try {
    const [h] = await window.showOpenFilePicker({ types: tiposJSON });
    if (await h.requestPermission({ mode: 'readwrite' }) !== 'granted') return;
    await usarHandle(h);
  } catch (e) { if (e.name !== 'AbortError') toast('❌ ' + e.message); }
}
async function usarHandle(h) {
  archivo.handle = h;
  await idbOp(st => st.put(h, 'handle'));
  await conectarArchivo();
  document.getElementById('arch')?.remove();
  toast('💾 Listo. Desde ahora todo se guarda también en ' + h.name);
}
async function reconectarArchivo() {
  try {
    if (await archivo.handle.requestPermission({ mode: 'readwrite' }) === 'granted') await conectarArchivo();
  } catch (e) { toast('❌ ' + e.message); }
  renderArchivo();
}
async function desconectarArchivo() {
  await idbOp(st => st.delete('handle'));
  archivo.handle = null; archivo.estado = 'none';
  document.getElementById('arch')?.remove(); renderArchivo(); render();
}
function renderArchivo() {
  const b = document.getElementById('archivoBtn');
  if (!b) return;
  if (!fsSoportado) { b.hidden = true; return; }
  b.className = archivo.estado === 'permiso' ? 'warnbtn' : '';
  b.innerHTML = ic(archivo.estado === 'permiso' ? 'alert' : 'save') + (archivo.estado === 'ok'
    ? `<span>Archivo <span class="muted">${archivo.ultimo ? '· ' + archivo.ultimo.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) : ''}</span></span>`
    : archivo.estado === 'permiso' ? 'Reconectar archivo' : 'Guardar en archivo');
}
function clickArchivo() {
  if (archivo.estado === 'permiso') return reconectarArchivo();
  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'arch';
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  bg.innerHTML = archivo.estado === 'ok'
    ? `<div class="modal"><h3>Archivo de datos</h3>
        <p>Todo se guarda automáticamente en <b>${esc(archivo.handle.name)}</b> cada vez que cambiás algo${archivo.ultimo ? ' (último guardado: ' + archivo.ultimo.toLocaleString('es-AR') + ')' : ''}.</p>
        <p class="muted">Si cambiás de compu o de navegador, abrí esta página y elegí "Ya tengo un archivo" con este mismo archivo.</p>
        <div class="toolbar"><button onclick="abrirArchivo()">Usar otro archivo</button><span class="sp"></span>
        <button class="danger" onclick="desconectarArchivo()">Dejar de guardar en archivo</button>
        <button class="primary" onclick="document.getElementById('arch').remove()">Listo</button></div></div>`
    : `<div class="modal"><h3>Guardar todo en un archivo</h3>
        <p>Además de guardarse en el navegador, tus datos (meses, asignaciones, pagos) se van a guardar solos en un archivo de tu compu, por ejemplo en <b>C:\\resumenes</b>.
        Así no se pierden si borrás el historial, y podés llevarlos a otra compu.</p>
        <div class="toolbar">
          <button class="primary" onclick="crearArchivo()">Crear archivo nuevo</button>
          <button onclick="abrirArchivo()">Ya tengo un archivo</button>
          <span class="sp"></span><button onclick="document.getElementById('arch').remove()">Cancelar</button></div>
        <p class="muted" style="font-size:12.5px;margin-bottom:0">Cada vez que abras la página, el navegador te puede pedir permiso para seguir usando el archivo: tocá "Reconectar archivo" arriba y aceptá. Si el navegador ofrece "Permitir en cada visita", elegilo y no te lo vuelve a preguntar.</p></div>`;

function titularKey(t) {
  if (t === 'IMPUESTOS') return t;
  const toks = t.trim().split(/\s+/);
  if (toks.every(x => /^\d+$/.test(x))) return 'TARJETA ' + toks[toks.length - 1];
  return toks[0] + ' ' + toks[toks.length - 1];
}
function personaDeTitular(t) {
  if (t === 'IMPUESTOS') return state.principal;
  const k = titularKey(t);
  if (state.claves[k]) return state.claves[k];
  // New cardholder: create a person for them (can be renamed / merged in Configuración)
  const toks = k.split(' ');
  const nom = toks[0] === 'TARJETA' ? 'Tarjeta ' + toks[1] : toks[0][0] + toks[0].slice(1).toLowerCase();
  let id = nom.toLowerCase().replace(/[^a-z0-9]/g, '') || uid();
  while (persona(id)) id += '2';
  state.personas.push({ id, nombre: nom });
  state.claves[k] = id;
  return id;
}
// Same purchase across months (installments keep date + coupon).
function reglaKey(tarjeta, g) {
  if (!g.cuota) return null;
  return [tarjeta, g.fecha, g.cupon, g.cuota.split('/')[1]].join('|');
}
function matchKey(g) { return [g.tarjeta, g.fecha, g.desc, g.cupon, g.cuota, g.pesos, g.usd].join('|'); }

// ===== IMPORT =====
async function importarArchivos(files) {
  const btn = document.getElementById('subirBtn');
  btn.disabled = true;
  for (const [i, f] of files.entries()) {
    toast(`Leyendo ${f.name}${files.length > 1 ? ` (${i + 1} de ${files.length})` : ''}…`, Infinity);
    try { await importar(f); }
    catch (e) { console.error(e); toast('❌ No pude leer "' + f.name + '": ' + e.message, 8000); }
  }
  btn.disabled = false;
  document.querySelector('.toast .spin')?.parentElement.remove();
}
async function importar(file) {
  const data = new Uint8Array(await file.arrayBuffer());
  const pdf = await pdfjsLib.getDocument({ data }).promise;
  const lines = await extractLines(pdf);
  const r = parseResumen(lines);
  if (!r.gastos.length) throw new Error('no encontré gastos (¿es un resumen de BBVA?)');
  const ref = r.vencimiento || r.cierre;
  if (!ref) throw new Error('no encontré la fecha de vencimiento');
  const key = ref.y + '-' + String(ref.m).padStart(2, '0');
  const mes = state.meses[key] || (state.meses[key] = { dolar: state.dolar, resumenes: {}, gastos: [], pagos: {} });

  // When re-uploading the same card/month keep the manual reassignments.
  const previos = {}, notasPrev = {}, catPrev = {};
  if (mes.resumenes[r.tarjeta]) {
    if (!confirm(`Ya hay un resumen ${r.tarjeta} cargado para ${mesNombre(key)}. ¿Reemplazarlo?\n(Se mantienen los cambios de "de quién" que hiciste)`)) return;
    for (const g of mes.gastos) if (g.tarjeta === r.tarjeta) {
      previos[matchKey(g)] = asignacion(g);
      if (g.nota) notasPrev[matchKey(g)] = g.nota;
      if (g.catManual) catPrev[matchKey(g)] = g.cat;
    }
    mes.gastos = mes.gastos.filter(g => g.tarjeta !== r.tarjeta);
  }
  let recordados = 0;
  for (const g of r.gastos) {
    const auto = personaDeTitular(g.titular);
    const item = {
      id: uid(), tarjeta: r.tarjeta, fecha: g.fecha, desc: g.desc, cuota: g.cuota, cupon: g.cupon,
      titular: g.titular, seccion: g.seccion, pesos: g.pesos, usd: g.usd, auto, de: auto
    };
    if (/^DEVOLUCION DE SALDOS/i.test(g.desc)) item.de = item.auto = NO_CONTAR; // offsets the "CR.RG" credit in payments
    const rk = reglaKey(r.tarjeta, item);
    if (rk && state.reglas[rk]) { aplicarAsignacion(item, state.reglas[rk]); recordados++; }
    const pk = matchKey(item);
    if (previos[pk] !== undefined) aplicarAsignacion(item, previos[pk]);
    state.notas = state.notas || {};
    if (rk && state.notas[rk]) item.nota = state.notas[rk];
    if (notasPrev[pk]) item.nota = notasPrev[pk];
    asegurarCategorias();
    if (catPrev[pk] !== undefined) { item.cat = catPrev[pk]; item.catManual = true; }
    else item.cat = categoriaAuto(item);
    mes.gastos.push(item);
  }
  mes.resumenes[r.tarjeta] = {
    archivo: file.name, cierre: r.cierre, vencimiento: r.vencimiento,
    saldoPesos: r.saldoPesos, saldoUSD: r.saldoUSD, cargado: new Date().toISOString(), warnings: r.warnings
  };
  save();
  ui.tab = key; ui.filtroPersona = ''; ui.filtroTarjeta = '';
  render();
  let msg = `✅ ${r.tarjeta} ${mesNombre(key)}: ${r.gastos.length} movimientos.`;
  if (recordados) msg += `\n↻ ${recordados} cuota(s) asignadas según cambios que hiciste en meses anteriores.`;
  if (r.warnings.length) msg += '\n⚠ ' + r.warnings.join('\n⚠ ');
  else msg += '\nTotales por titular verificados contra el resumen ✓';
  toast(msg, r.warnings.length ? 12000 : 6000);
}

// ===== ACTIONS =====
function cambiarDe(mk, id, de) {
  const mes = state.meses[mk];
  const g = mes.gastos.find(x => x.id === id);

// a: persona id, NO_CONTAR or {partes}
function asignar(mk, g, a) {
  aplicarAsignacion(g, a);
  const rk = reglaKey(g.tarjeta, g);
  let n = 0;
  if (rk) {
    // Installment: remember it and apply to the following months already loaded.
    state.reglas[rk] = a;
    for (const k of mesesOrden()) {
      if (k <= mk) continue;
      for (const o of state.meses[k].gastos)
        if (reglaKey(o.tarjeta, o) === rk && !mismaAsignacion(asignacion(o), a)) { aplicarAsignacion(o, a); n++; }
    }
  }
  save(); render();
  const quien = typeof a === 'object' ? 'dividida entre ' + a.partes.map(p => nombre(p.de)).join(', ') : 'asignada a ' + nombre(a);
  if (rk) toast(`Cuota ${quien}. Las próximas cuotas de esta compra también${n ? ` (actualicé ${n} en meses siguientes)` : ''}.`);
}

      ${g.de === DIVIDIDO ? `<button class="danger" onclick="document.getElementById('div').remove();asignar('${mk}',state.meses['${mk}'].gastos.find(x=>x.id==='${id}'),'${g.auto === DIVIDIDO ? state.principal : g.auto}')">Quitar división</button>` : ''}

const parseMonto = s => parseFloat(String(s).trim().replace(/\$/g, '').replace(/\./g, '').replace(',', '.'));
// Manual expenses can change their amount inside the dialog.
function divTotal(t) {
  const i = document.getElementById('divMonto');
  if (!i) return t;
  const n = parseMonto(i.value);
  return isFinite(n) ? n : 0;
}
function divIguales(total) {
  total = divTotal(total);
  const checks = [...document.querySelectorAll('#divRows [data-p]')];
  const on = checks.filter(c => c.checked);
  const parte = on.length ? Math.floor(total / on.length * 100) / 100 : 0;
  checks.forEach(c => {
    const inp = document.querySelector(`#divRows [data-m="${c.dataset.p}"]`);
    inp.disabled = !c.checked; inp.value = c.checked ? fmt.format(parte) : '';
  });
  // put the rounding cents on the first one so it adds up exactly
  if (on.length) {
    const first = document.querySelector(`#divRows [data-m="${on[0].dataset.p}"]`);
    first.value = fmt.format(Math.round((total - parte * (on.length - 1)) * 100) / 100);
  }
  divCheck(total);
}
function divLeer() {
  return [...document.querySelectorAll('#divRows [data-p]')].filter(c => c.checked)
    .map(c => ({ de: c.dataset.p, monto: parseMonto(document.querySelector(`#divRows [data-m="${c.dataset.p}"]`).value) }));
}
function divCheck(total) {
  total = divTotal(total);
  const ps = divLeer();
  const suma = ps.reduce((a, p) => a + (isFinite(p.monto) ? p.monto : 0), 0);
  const dif = Math.round((total - suma) * 100) / 100;
  const ok = ps.length >= 1 && ps.every(p => isFinite(p.monto)) && Math.abs(dif) < 0.01;
  document.getElementById('divMsg').innerHTML = !ps.length ? 'Marcá al menos una persona.'
    : ps.length === 1 && ok ? `<span class="ok">✓ Todo para ${esc(nombre(ps[0].de))}</span> · marcá a otra persona para dividirlo`
    : Math.abs(dif) < 0.01 ? '<span class="ok">✓ La suma da el total</span>'
    : `<span class="bad">${dif > 0 ? 'Faltan' : 'Sobran'} ${$(Math.abs(dif))} para llegar al total</span>`;
  document.getElementById('divOk').disabled = !ok;
}
function guardarDividir(mk, id, total) {

    const desc = document.getElementById('divDesc').value.trim();
    if (!desc) { toast('Poné una descripción.'); return; }
    g.desc = desc;
    g.fecha = document.getElementById('divFecha').value || g.fecha;
    g.pesos = total; g.usd = 0;
  }
  const ps = divLeer().filter(p => p.monto !== 0);
  const a = ps.length === 1 ? ps[0].de : { partes: ps.map(p => ({ de: p.de, frac: total ? p.monto / total : 1 / ps.length })) };
  const nota = document.getElementById('divNota').value.trim();
  document.getElementById('div').remove();
  setNota(mk, g, nota);
  if (mismaAsignacion(asignacion(g), a)) { save(); render(); if (g.manual) toast('✓ Gasto actualizado'); else if (nota) toast('📝 Nota guardada' + (reglaKey(g.tarjeta, g) ? ', también para las próximas cuotas.' : '.')); }
  else asignar(mk, g, a);
}
function setNota(mk, g, nota) {

  const rk = reglaKey(g.tarjeta, g);
  if (!rk) return;
  // Installment: the note follows the purchase into the next months.
  state.notas = state.notas || {};
  if (nota) state.notas[rk] = nota; else delete state.notas[rk];
  for (const k of mesesOrden()) {
    if (k <= mk) continue;
    for (const o of state.meses[k].gastos) if (reglaKey(o.tarjeta, o) === rk) { if (nota) o.nota = nota; else delete o.nota; }

function setDolar(mk, v) {

}
// Payments received: mes.pagos[pid][tarjeta] = [{monto, fecha}].
const pagosDe = (mes, pid, t) => ((mes.pagos || {})[pid] || {})[t] || [];
const faltaTarjeta = (mes, pid, t, monto) => monto - pagosDe(mes, pid, t).reduce((a, x) => a + x.monto, 0);

function estadoPago(mes, pid, porT) {

  const cobrado = Object.values((mes.pagos || {})[pid] || {}).flat().reduce((a, x) => a + x.monto, 0);
  const saldo = deuda - cobrado;
  return { deuda, cobrado, falta: Math.max(0, saldo), aFavor: Math.max(0, -saldo), todo: deuda > 0.005 && saldo < 0.005, parte: cobrado > 0 && saldo >= 0.005 };

    for (const [pid, v] of Object.entries(mes.pagado)) {

      for (const t of ts) if ((porT[pid] || {})[t] > 0) sumarPago(mes, pid, t, { monto: Math.round(porT[pid][t] * 100) / 100, fecha: '' });

function agregarManual(mk) {

function textoPersona(mk, pid) {
  const mes = state.meses[mk];
  const gs = mes.gastos.filter(g => esDe(g, pid)).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const porT = totalesPorTarjeta(mes)[pid] || {};
  const tarjetas = ordenTarjetas([...new Set(gs.map(g => g.tarjeta))]);
  let t = `Gastos de ${nombre(pid)} – ${mesNombre(mk)}\n`;
  for (const tj of tarjetas) {
    t += `\n*${nombreTarjeta(tj).toUpperCase()}*\n`;
    for (const g of gs.filter(g => g.tarjeta === tj)) {
      const f = fracDe(g, pid);
      t += `• ${fechaCorta(g.fecha)} ${g.desc}${g.cuota ? ' (cuota ' + g.cuota + ')' : ''}: ${$(montoPesos(g, mes) * f)}`;
      if (f < 1) t += ` (tu parte de ${$(montoPesos(g, mes))})`;
      else if (g.usd) t += ` (USD ${fmt.format(g.usd)})`;
      t += '\n';
    }
    t += `Subtotal ${nombreTarjeta(tj)}: ${$(porT[tj] || 0)}\n`;
  }
  t += '\n';
  if (tarjetas.length > 1) t += tarjetas.map(tj => `${nombreTarjeta(tj)}: ${$(porT[tj] || 0)}`).join('\n') + '\n';
  t += `*TOTAL: ${$(totalesMes(mes)[pid] || 0)}*`;
  const e = estadoPago(mes, pid, totalesPorTarjeta(mes));
  if (e.cobrado > 0) t += `\nYa pagaste: ${$(e.cobrado)}\n*${e.falta >= 0.005 ? 'FALTA: ' + $(e.falta) : 'PAGADO ✓'}*`;
  return t;
}
async function copiarPersona(mk, pid, ev) {
  ev.stopPropagation();
  const t = textoPersona(mk, pid);
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();

  toast(`📋 Copié el detalle de ${nombre(pid)}. Pegalo en WhatsApp o donde quieras.`);

function deltaMes(ahora, antes, nombreAntes) {
  if (!(antes > 0)) return '';
  const d = (ahora - antes) / antes * 100;
  return `<span class="delta ${d >= 0 ? 'sube' : 'baja'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(0)}%</span> vs ${nombreAntes}`;

// Tiny trend line; needs at least two real values.
function spark(vals, color = 'var(--accent)') {
  if (vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals), rango = max - min || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * 100, 30 - (v - min) / rango * 26]);
  const linea = pts.map(([x, y], i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true"><path d="${linea} L100 32 L0 32 Z" fill="${color}" opacity=".12"/><path d="${linea}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
const badgePago = e => e.todo ? `<span class="badge ok">${ic('check')}Pagado</span>` : e.parte ? `<span class="badge parcial">${ic('half')}Parcial</span>` : `<span class="badge pend">${ic('clock')}Pendiente</span>`;
const barraPago = e => { const pct = Math.min(100, e.cobrado / e.deuda * 100); return `<div class="bar ${e.todo ? 'lleno' : ''}" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100" aria-label="Pagado"><i style="width:${pct.toFixed(1)}%"></i></div>`; };
function venceTexto(f) {
  if (!f) return '';

  const d = Math.round((new Date(f.y, f.m - 1, f.d) - hoy) / 864e5);

}

// {cat: {total, meses: {k: monto}}} for one person's share ('_all' = everybody)
function catTotales(ms, pid) {
  const out = {};
  const sumar = (k, c, v) => {
    out[c] = out[c] || { total: 0, meses: {} };
    out[c].total += v; out[c].meses[k] = (out[c].meses[k] || 0) + v;
  };
  for (const k of ms) {
    const mes = state.meses[k];
    for (const g of mes.gastos) {
      if (!partes(g).length) continue;
      const f = pid === '_all' ? 1 : fracDe(g, pid);
      if (!f) continue;
      sumar(k, g.cat || '', montoPesos(g, mes) * f);
    }
    if (pid === '_all' || pid === state.principal) for (const x of gastosFuera(k)) sumar(k, x.cat, x.v);

function topComercios(ms, pid, n) {
  const acc = {}; let total = 0;
  for (const k of ms) {
    const mes = state.meses[k];
    for (const g of mes.gastos) {
      if (!partes(g).length || g.seccion === 'impuestos') continue;
      const f = pid === '_all' ? 1 : fracDe(g, pid);
      if (!f) continue;
      const c = comercio(g.desc), v = montoPesos(g, mes) * f;
      acc[c] = acc[c] || { nombre: c, total: 0, n: 0 };
      acc[c].total += v; acc[c].n++; total += v;
    }
  }
  return { total, lista: Object.values(acc).filter(c => c.total > 0).sort((a, b) => b.total - a.total).slice(0, n) };
}

function categoriaAuto(g) {

  const d = g.desc.toUpperCase();

}

function asegurarCategorias() {

function setCategoria(mk, id, cat) {

    cat = pedirCategoria();
    if (cat === null) { render(); return; }
  }
  const g = state.meses[mk].gastos.find(x => x.id === id);
  g.cat = cat; g.catManual = true;
  const rk = reglaKey(g.tarjeta, g), c = comercio(g.desc);
  const porComercio = !GENERICOS.includes(c) && g.seccion !== 'impuestos';
  if (rk) state.catCuota[rk] = cat;

const SECCIONES = [['ingreso', 'Ingresos', '+ Agregar ingreso'], ['gasto', 'Gastos', '+ Agregar gasto'], ['ahorro', 'Ahorro e inversión', '+ Agregar ahorro']];
function asegurarPresu() {

}
const mesKey = (y, m) => y + '-' + String(m).padStart(2, '0');
// My share of a card in that month (from the uploaded statements), or null if not loaded.
function autoTarjeta(k, tarjeta) {
  const mes = state.meses[k];
  if (!mes || !mes.resumenes[tarjeta]) return null;
  return (totalesPorTarjeta(mes)[state.principal] || {})[tarjeta] || 0;
}
function valorManual(k, id) { const v = (state.presu.valores[k] || {})[id]; return v === undefined || v === null ? null : v; }
function valorPresu(k, f) {
  const v = valorManual(k, f.id);
  if (v !== null) return v;

}
function totalesPresu(k) {
  const t = { ingreso: 0, gasto: 0, ahorro: 0 };
  for (const f of state.presu.filas) t[f.tipo] += valorPresu(k, f);
  t.queda = t.ingreso - t.gasto - t.ahorro;

}
function parsePlata(s) {
  s = String(s).replace(/\$/g, '').replace(/\s/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}
const fmtCelda = n => new Intl.NumberFormat('es-AR', { maximumFractionDigits: 2 }).format(n);
function setPresu(k, id, txt) {
  const n = parsePlata(txt);
  if (Number.isNaN(n)) { toast('No entendí ese número. Escribilo como 1.200.000 o 1200000.'); render(); return; }
  state.presu.valores[k] = state.presu.valores[k] || {};
  if (n === null) delete state.presu.valores[k][id]; else state.presu.valores[k][id] = n;
  // render after the focus moved to the next cell, so it can be restored
  setTimeout(() => { save(); render(); }, 0);
}
// Typing in a cell saves right away (without redrawing), so nothing is lost if the page redraws,
// the phone switches apps or the keyboard is closed before the cell loses focus.
function tipeoPresu(el, k, id) {
  const n = parsePlata(el.value);
  if (Number.isNaN(n)) return;
  state.presu.valores[k] = state.presu.valores[k] || {};
  if (n === null) delete state.presu.valores[k][id]; else state.presu.valores[k][id] = n;
  el.dataset.exact = '';

}
// Enter works like moving to the next field: in a budget cell, the one below (same month);
// in the manual-expense form, the next field, adding the expense when everything is filled in;
// in a dialog, the next field.
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.shiftKey) return;
  const el = e.target;
  if (!(el instanceof HTMLInputElement) || !['text', 'number', 'date', ''].includes(el.type)) return;
  const fk = el.dataset.focus || '';
  if (fk.startsWith('p|')) {
    e.preventDefault();
    const pref = fk.split('|').slice(0, 2).join('|') + '|';
    const celdas = [...document.querySelectorAll(`input[data-focus^="${pref}"]`)];
    const sig = celdas[celdas.indexOf(el) + 1];
    const [, k, id] = fk.split('|');
    setPresu(k, id, el.value);   // commit now (formats and adds up), without waiting for the browser's change event
    if (sig) sig.focus(); else el.blur();
    return;
  }
  const form = el.closest('#man');
  if (form) {
    e.preventDefault();
    const campos = [...form.querySelectorAll('input')];
    const vacio = campos.find(c => !c.value.trim() && c !== el);
    if (!el.value.trim()) return;
    if (vacio) vacio.focus(); else form.requestSubmit();
    return;
  }
  const modal = el.closest('.modal');
  if (modal) {
    e.preventDefault();
    const campos = [...modal.querySelectorAll('input[type=text], input[type=number], input[type=date], textarea')].filter(c => !c.disabled && c.offsetParent);
    const sig = campos[campos.indexOf(el) + 1];
    if (sig) { sig.focus(); if (sig.select) sig.select(); } else el.blur();
  }
});
function aniosPresu() {
  const ys = new Set([new Date().getFullYear()]);
  Object.keys(state.meses).concat(Object.keys(state.presu.valores)).forEach(k => ys.add(+k.slice(0, 4)));
  return [...ys].sort();
}

function setCatFila(id, cat) {

// Savings history: every month from the first entry to the last one, whatever months the grid shows.
function serieAhorro() {
  const todas = state.presu.filas.filter(f => f.tipo === 'ahorro');
  const con = Object.keys(state.presu.valores).filter(k => todas.some(f => valorPresu(k, f))).sort();
  if (!con.length) return null;
  const [y0, m0] = con[0].split('-').map(Number);
  const ks = [];
  for (let i = 0; !ks.length || ks[ks.length - 1] < con[con.length - 1]; i++) { const d = new Date(y0, m0 - 1 + i, 1); ks.push(mesKey(d.getFullYear(), d.getMonth() + 1)); }
  const filas = todas.filter(f => ks.some(k => valorPresu(k, f)));
  let acc = 0;
  return { ks, filas, acum: ks.map(k => acc += filas.reduce((a, f) => a + valorPresu(k, f), 0)) };
}

// Import the "Gastos Mensuales" sheet(s) of the old spreadsheet: names in column A, months as columns.
async function importarExcel(file) {
  if (!file) return;
  try {
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await file.arrayBuffer());
    const hojas = wb.worksheets.filter(w => /gastos mensuales/i.test(w.name));
    if (!hojas.length) throw new Error('no encontré ninguna hoja llamada "Gastos Mensuales"');
    const plan = [];
    for (const ws of hojas) {
      let headRow = null, cols = {};
      for (let r = 1; r <= 15 && !headRow; r++) {
        const c = {};
        ws.getRow(r).eachCell((cell, col) => {
          const i = NOMBRES_MES.findIndex(m => String(cell.value || '').trim().toLowerCase() === m.toLowerCase());
          if (i >= 0) c[col] = i + 1;
        });
        if (Object.keys(c).length >= 6) { headRow = r; cols = c; }
      }
      if (!headRow) continue;
      const ym = ws.name.match(/(\d{4})/);
      let anio = ym ? +ym[1] : null;
      if (!anio) {
        const r = prompt(`¿De qué año es la hoja "${ws.name}"?`, String(new Date().getFullYear()));
        if (!r) continue;
        anio = parseInt(r, 10);
      }
      let despuesDelTotal = false;
      for (let r = headRow + 1; r <= ws.rowCount; r++) {
        const row = ws.getRow(r);
        const nombre = String(row.getCell(1).value ?? '').trim();
        if (!nombre) continue;
        if (/^total/i.test(nombre)) { despuesDelTotal = true; continue; }
        if (/^(resta|me queda|saldo|queda)/i.test(nombre)) continue;
        const vals = {};
        for (const [col, m] of Object.entries(cols)) {
          const v = row.getCell(+col).value;
          if (typeof v === 'number') vals[mesKey(anio, m)] = v;
        }
        if (!Object.keys(vals).length) continue;
        let tipo = 'gasto', auto = null;
        if (despuesDelTotal || /sueldo|ingreso|aguinaldo|cobro/i.test(nombre)) tipo = 'ingreso';
        else if (/ahorro|d[oó]lar|mep|acciones|plazo fijo|invers|cedear|fci/i.test(nombre)) tipo = 'ahorro';
        if (/tarjeta\s*visa/i.test(nombre)) auto = 'Visa';
        else if (/tarjeta\s*master/i.test(nombre)) auto = 'Mastercard';
        plan.push({ nombre, tipo, auto, vals, anio });
      }
    }
    if (!plan.length) throw new Error('no encontré filas con números en la hoja');
    const anios = [...new Set(plan.map(p => p.anio))].join(', ');
    if (!confirm(`Voy a cargar ${plan.length} fila(s) de tu Excel en ${anios}:\n\n${plan.map(p => '• ' + p.nombre + ' (' + (p.tipo === 'ingreso' ? 'ingreso' : p.tipo === 'ahorro' ? 'ahorro' : 'gasto') + ')').join('\n')}\n\nSi ya habías escrito valores en esas celdas, se reemplazan. Las tarjetas de los meses que ya subiste siguen usando el resumen. ¿Seguir?`)) return;
    for (const p of plan) {
      let f = p.auto ? state.presu.filas.find(x => x.auto === p.auto)
        : state.presu.filas.find(x => !x.auto && x.tipo === p.tipo && x.nombre.toLowerCase() === p.nombre.toLowerCase());
      if (!f) { f = { id: uid(), nombre: p.nombre[0].toUpperCase() + p.nombre.slice(1), tipo: p.tipo }; state.presu.filas.push(f); }
      for (const [k, v] of Object.entries(p.vals)) {
        if (p.auto && autoTarjeta(k, p.auto) !== null) continue;   // the statement is the source of truth
        state.presu.valores[k] = state.presu.valores[k] || {};
        state.presu.valores[k][f.id] = v;
      }
    }
    // Drop the starter rows that stayed empty.
    state.presu.filas = state.presu.filas.filter(f => f.auto || !['ing1', 'ing2', 'g1', 'ah1'].includes(f.id) || Object.values(state.presu.valores).some(m => m[f.id] !== undefined));
    ui.presuVista = String(plan[0].anio);
    save(); render();
    toast(`✅ Importé ${plan.length} fila(s) de "${file.name}".`);
  } catch (e) { console.error(e); toast('❌ No pude importar el Excel: ' + e.message, 8000); }
}

    </div>
    <div style="text-align:right;margin-top:18px"><button class="primary" onclick="cerrarConfig()">Listo</button></div>
  </div>`;
  document.body.appendChild(bg);
}
function cerrarConfig() { document.getElementById('cfg')?.remove(); render(); }
function refrescarConfig() { cerrarConfig(); abrirConfig(); }
function renombrar(id, v) { const p = persona(id); if (p && v.trim()) { p.nombre = v.trim(); save(); render(); } }
function nuevaPersona() {
  const n = prompt('Nombre de la persona:'); if (!n || !n.trim()) return;
  let id = n.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '') || uid();
  while (persona(id)) id += '2';
  state.personas.push({ id, nombre: n.trim() }); save(); refrescarConfig();
}
function borrarPersona(id) {
  const usado = Object.values(state.meses).some(m => m.gastos.some(g => esDe(g, id) || g.auto === id)) || Object.values(state.claves).includes(id);
  if (usado) { alert('Esta persona tiene gastos o es titular de una tarjeta. Primero reasigná esos gastos / el titular a otra persona.'); return; }
  if (id === state.principal) { alert('No podés eliminar a la persona principal.'); return; }
  state.personas = state.personas.filter(p => p.id !== id); save(); refrescarConfig();
}
function reasignarClave(k, pid) {
  // Move the expenses of that cardholder that were not reassigned by hand.
  for (const m of Object.values(state.meses)) for (const g of m.gastos) {
    if (g.titular && titularKey(g.titular) === k) { if (g.de === g.auto) g.de = pid; g.auto = pid; }
  }
  save(); render();
}
function backup() {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
  descargar(blob, 'gastos-tarjetas-backup-' + new Date().toISOString().slice(0, 10) + '.json');
}
async function restaurar(f) {
  if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s.meses || !s.personas) throw new Error('no parece una copia de esta página');
    if (!confirm('Esto reemplaza todos los datos actuales por los de la copia. ¿Seguir?')) return;
    state = s; save(); refrescarConfig(); toast('Copia restaurada ✓');
  } catch (e) { toast('❌ ' + e.message); }
}
function resetTodo() {
  if (!confirm('¿Borrar TODOS los meses, personas y configuración? Esto no se puede deshacer (salvo que tengas una copia).')) return;
  state = defaultState(); save(); ui.tab = 'resumen'; refrescarConfig();
}
function descargar(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ===== EXCEL =====
async function exportarExcel() {
  const meses = mesesOrden();
  if (!meses.length) { toast('Primero subí algún resumen.'); return; }
  asegurarPresu();
  // Budget values with the card rows already resolved (the workbook builder has no access to the statements).
  const presu = aniosPresu().map(y => {
    const ks = Array.from({ length: 12 }, (_, i) => mesKey(y, i + 1));
    return { anio: y, filas: state.presu.filas.map(f => ({ nombre: f.nombre, tipo: f.tipo, cat: f.cat || '', valores: ks.map(k => valorPresu(k, f)) })) };
  }).filter(p => p.filas.some(f => f.valores.some(v => v)));
  const catFuera = {};
  for (const k of meses) for (const x of gastosFuera(k)) { catFuera[k] = catFuera[k] || {}; catFuera[k][x.cat] = (catFuera[k][x.cat] || 0) + x.v; }
  const wb = buildWorkbook(ExcelJS, state, { presu, catFuera });
  const buf = await wb.xlsx.writeBuffer();
  const y = [...new Set(meses.map(k => k.slice(0, 4)))].join('-');
  descargar(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `Gastos tarjetas ${y}.xlsx`);
}
// Builds the workbook: "Resumen" (people x months, formulas) + one sheet per month.
function buildWorkbook(ExcelJS, st, extra) {
  const MESES_N = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const NONE = '_none', SPLIT = '_split';
  const mesN = k => { const [y, m] = k.split('-'); return MESES_N[+m - 1] + ' ' + y; };
  const nom = id => id === NONE ? 'No contar' : ((st.personas.find(p => p.id === id) || {}).nombre || id);
  const pers = st.personas.slice().sort((a, b) => (b.id === st.principal) - (a.id === st.principal));
  const keys = Object.keys(st.meses).sort();
  const money = '"$" #,##0.00;[Red]-"$" #,##0.00';
  const usdFmt = '#,##0.00';
  const head = { font: { bold: true, color: { argb: 'FFFFFFFF' } }, fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2457D6' } } };
  const meFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE3F5EE' } };
  const chgFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF2B3' } };
  const style = (cell, s) => Object.assign(cell, s);
  const q = name => "'" + name.replace(/'/g, "''") + "'";

  const wb = new ExcelJS.Workbook();
  wb.creator = 'Gastos de Tarjetas';
  wb.calcProperties.fullCalcOnLoad = true;
  const res = wb.addWorksheet('Resumen', { views: [{ state: 'frozen', xSplit: 1, ySplit: 3 }] });
  const catWs = wb.addWorksheet('Categorías', { views: [{ state: 'frozen', xSplit: 1, ySplit: 3 }] });
  // Ingresos y gastos (one sheet per year), like the old "Gastos Mensuales" sheet
  for (const py of (extra && extra.presu) || []) {
    const ws = wb.addWorksheet('Ingresos y gastos ' + py.anio, { views: [{ state: 'frozen', xSplit: 1, ySplit: 3 }] });
    ws.getCell('A1').value = 'Ingresos y gastos ' + py.anio;
    ws.getCell('A1').font = { bold: true, size: 14 };
    ws.getCell('A3').value = 'Concepto'; style(ws.getCell('A3'), head);
    MESES_N.forEach((m, i) => { const c = ws.getCell(3, 2 + i); c.value = m; style(c, head); c.alignment = { horizontal: 'center' }; });
    ws.getCell(3, 14).value = 'Total'; style(ws.getCell(3, 14), head);
    ws.getCell(3, 15).value = 'Categoría'; style(ws.getCell(3, 15), head);
    const L = n => ws.getColumn(n).letter;
    let r = 4;
    const subt = {};
    for (const [tipo, titulo] of [['ingreso', 'Ingresos'], ['gasto', 'Gastos'], ['ahorro', 'Ahorro e inversión']]) {
      ws.getCell(r, 1).value = titulo.toUpperCase(); ws.getCell(r, 1).font = { bold: true, color: { argb: 'FF6B7385' } };
      r++;
      const desde = r;
      for (const f of py.filas.filter(x => x.tipo === tipo)) {
        ws.getCell(r, 1).value = f.nombre;
        f.valores.forEach((v, i) => { if (v) { ws.getCell(r, 2 + i).value = Math.round(v * 100) / 100; ws.getCell(r, 2 + i).numFmt = money; } });
        ws.getCell(r, 14).value = { formula: `SUM(B${r}:M${r})`, result: f.valores.reduce((a, b) => a + b, 0) };
        ws.getCell(r, 14).numFmt = money; ws.getCell(r, 14).font = { bold: true };
        if (f.cat) ws.getCell(r, 15).value = f.cat;
        r++;
      }
      const hasta = r - 1;
      ws.getCell(r, 1).value = 'Total ' + titulo.toLowerCase(); ws.getCell(r, 1).font = { bold: true };
      for (let c = 2; c <= 14; c++) {
        const cell = ws.getCell(r, c);
        const res = py.filas.filter(x => x.tipo === tipo).reduce((a, f) => a + (c <= 13 ? f.valores[c - 2] : f.valores.reduce((x, y) => x + y, 0)), 0);
        cell.value = hasta >= desde ? { formula: `SUM(${L(c)}${desde}:${L(c)}${hasta})`, result: res } : 0;
        cell.numFmt = money; cell.font = { bold: true };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0F2F5' } };
      }
      subt[tipo] = r;
      r += 2;
    }
    ws.getCell(r, 1).value = 'Me queda'; ws.getCell(r, 1).font = { bold: true, size: 12 };
    for (let c = 2; c <= 14; c++) {
      const cell = ws.getCell(r, c);
      const col = L(c);
      const v = t => (ws.getCell(subt[t], c).value || {}).result || 0;
      cell.value = { formula: `${col}${subt.ingreso}-${col}${subt.gasto}-${col}${subt.ahorro}`, result: v('ingreso') - v('gasto') - v('ahorro') };
      cell.numFmt = money; cell.font = { bold: true, size: 12 };
      cell.border = { top: { style: 'medium' } };
    }
    ws.getColumn(1).width = 34;
    for (let c = 2; c <= 14; c++) ws.getColumn(c).width = 14;
    ws.getColumn(15).width = 24;
  }

  // Month sheets first (Resumen references them), Resumen stays as the first tab.
  const info = {};   // key -> {sheet, first, last, totals}
  for (const k of keys) {
    const mes = st.meses[k];
    const ws = wb.addWorksheet(mesN(k), { views: [{ state: 'frozen', ySplit: 7 }] });
    const usados = pers.filter(p => mes.gastos.some(g => g.de === p.id || (g.partes || []).some(q => q.de === p.id)));
    ws.getCell('A1').value = 'Gastos ' + mesN(k);
    ws.getCell('A1').font = { bold: true, size: 14 };
    ws.getCell('A2').value = 'Dólar';
    ws.getCell('B2').value = mes.dolar || 0; ws.getCell('B2').numFmt = money;
    const tarjetas = Object.entries(mes.resumenes || {}).map(([t, r]) => {
      const v = r.vencimiento ? `${String(r.vencimiento.d).padStart(2, '0')}/${String(r.vencimiento.m).padStart(2, '0')}/${r.vencimiento.y}` : '';
      return `${t} vence ${v}`;
    }).join(' · ');
    ws.getCell('D2').value = tarjetas; ws.getCell('D2').font = { italic: true, color: { argb: 'FF6B7385' } };

    const ord = id => { const i = pers.findIndex(p => p.id === id); return i < 0 ? 999 : i; };
    const filas = [];
    for (const g of mes.gastos) {
      if (g.de === SPLIT && g.partes && g.partes.length) {
        const tot = g.pesos + g.usd * (mes.dolar || 0);
        g.partes.forEach(p => filas.push({ ...g, de: p.de, auto: null,
          desc: `${g.desc} (dividido: ${Math.round(p.frac * 100)}% de $ ${tot.toLocaleString('es-AR', { maximumFractionDigits: 2 })})`,
          pesos: Math.round(g.pesos * p.frac * 100) / 100, usd: Math.round(g.usd * p.frac * 100) / 100 }));
      } else filas.push(g);
    }
    const gs = filas.slice().sort((a, b) => ord(a.de) - ord(b.de) || a.tarjeta.localeCompare(b.tarjeta) || a.fecha.localeCompare(b.fecha));
    const first = 8, last = Math.max(first, first + gs.length - 1);
    const rngF = `$F$${first}:$F$${last}`, rngI = `$I$${first}:$I$${last}`;

    // Totals per person (row 4 names, row 5 SUMIF)
    ws.getCell('A4').value = 'De quién'; ws.getCell('A5').value = 'Total $';
    ws.getCell('A4').font = ws.getCell('A5').font = { bold: true };
    const totals = {};
    for (const g of gs) if (g.de !== NONE) totals[g.de] = (totals[g.de] || 0) + g.pesos + g.usd * (mes.dolar || 0);
    usados.forEach((p, i) => {
      const c4 = ws.getCell(4, 2 + i), c5 = ws.getCell(5, 2 + i);
      c4.value = p.nombre; style(c4, head); c4.alignment = { horizontal: 'center' };
      c5.value = { formula: `SUMIF(${rngF},${c4.address},${rngI})`, result: Math.round((totals[p.id] || 0) * 100) / 100 };
      c5.numFmt = money; c5.font = { bold: true };
      if (p.id === st.principal) c5.fill = meFill;
    });

    const cols = ['Fecha', 'Descripción', 'Cuota', 'Tarjeta', 'Titular en resumen', 'De quién', 'Pesos', 'U$S', 'Total $', 'Nota', 'Categoría'];
    cols.forEach((c, i) => { const cell = ws.getCell(7, i + 1); cell.value = c; style(cell, head); });
    gs.forEach((g, i) => {
      const r = first + i;
      const [y, m, d] = g.fecha.split('-').map(Number);
      const row = ws.getRow(r);
      row.values = [new Date(Date.UTC(y, m - 1, d)), g.desc, g.cuota, g.tarjeta,
        g.titular === 'IMPUESTOS' ? 'Impuestos y cargos' : g.titular, nom(g.de), g.pesos || 0, g.usd || 0,
        { formula: `G${r}+H${r}*$B$2`, result: Math.round(((g.pesos || 0) + (g.usd || 0) * (mes.dolar || 0)) * 100) / 100 }, g.nota || '', g.cat || null];
      row.getCell(1).numFmt = 'dd/mm/yy';
      row.getCell(7).numFmt = money; row.getCell(8).numFmt = usdFmt; row.getCell(9).numFmt = money;
      if (g.de !== g.auto) for (let c = 1; c <= 9; c++) row.getCell(c).fill = chgFill;
      row.getCell(6).dataValidation = {
        type: 'list', allowBlank: true,
        formulae: ['"' + pers.map(p => p.nombre.replace(/[",]/g, ' ')).concat('No contar').join(',') + '"']
      };
    });
    const tr = last + 2;
    ws.getCell(`H${tr}`).value = 'TOTAL'; ws.getCell(`H${tr}`).font = { bold: true };
    ws.getCell(`I${tr}`).value = { formula: `SUMIF(${rngF},"<>No contar",${rngI})`, result: Object.values(totals).reduce((a, b) => a + b, 0) };
    ws.getCell(`I${tr}`).numFmt = money; ws.getCell(`I${tr}`).font = { bold: true };
    [11, 40, 8, 12, 24, 14, 15, 10, 15, 40, 26].forEach((w, i) => ws.getColumn(i + 1).width = w);
    ws.autoFilter = { from: 'A7', to: `K${last}` };
    info[k] = { sheet: q(mesN(k)), rngF, rngI, rngD: `$D$${first}:$D$${last}`, rngK: `$K$${first}:$K$${last}`, totals, gs, mes };
  }

  // Resumen
  res.getCell('A1').value = 'Gastos con tarjeta por persona y por mes';
  res.getCell('A1').font = { bold: true, size: 14 };
  res.getCell('A3').value = 'Persona'; style(res.getCell('A3'), head);
  keys.forEach((k, i) => { const c = res.getCell(3, 2 + i); c.value = mesN(k); style(c, head); c.alignment = { horizontal: 'center' }; });
  const totCol = 2 + keys.length;
  style(res.getCell(3, totCol), head); res.getCell(3, totCol).value = 'Total';
  const visibles = pers.filter(p => keys.some(k => info[k].totals[p.id]));
  visibles.forEach((p, i) => {
    const r = 4 + i;
    res.getCell(r, 1).value = p.nombre + (p.id === st.principal ? ' (yo)' : '');
    let sum = 0;
    keys.forEach((k, j) => {
      const inf = info[k], v = Math.round((inf.totals[p.id] || 0) * 100) / 100; sum += v;
      const c = res.getCell(r, 2 + j);
      c.value = { formula: `SUMIF(${inf.sheet}!${inf.rngF},"${p.nombre.replace(/"/g, '""')}",${inf.sheet}!${inf.rngI})`, result: v };
      c.numFmt = money;
    });
    const ct = res.getCell(r, totCol);
    ct.value = { formula: `SUM(${res.getCell(r, 2).address}:${res.getCell(r, totCol - 1).address})`, result: sum };
    ct.numFmt = money; ct.font = { bold: true };
    if (p.id === st.principal) for (let c = 1; c <= totCol; c++) { res.getCell(r, c).fill = meFill; res.getCell(r, c).font = { bold: true }; }
  });
  const rt = 4 + visibles.length;
  res.getCell(rt, 1).value = 'Total'; res.getCell(rt, 1).font = { bold: true };
  for (let c = 2; c <= totCol; c++) {
    const a = res.getCell(4, c).address, b = res.getCell(rt - 1, c).address;
    let v = 0; for (let r = 4; r < rt; r++) v += (res.getCell(r, c).value || {}).result || 0;
    const cell = res.getCell(rt, c);
    cell.value = { formula: `SUM(${a}:${b})`, result: v }; cell.numFmt = money; cell.font = { bold: true };
    cell.border = { top: { style: 'thin' } };
  }
  // Per card rows
  const cards = [...new Set(keys.flatMap(k => info[k].gs.map(g => g.tarjeta)))];
  cards.forEach((t, i) => {
    const r = rt + 2 + i;
    res.getCell(r, 1).value = 'Total ' + t; res.getCell(r, 1).font = { italic: true };
    keys.forEach((k, j) => {
      const inf = info[k];
      const v = inf.gs.filter(g => g.tarjeta === t && g.de !== NONE).reduce((a, g) => a + g.pesos + g.usd * (inf.mes.dolar || 0), 0);
      const c = res.getCell(r, 2 + j);
      c.value = { formula: `SUMIFS(${inf.sheet}!${inf.rngI},${inf.sheet}!${inf.rngD},"${t}",${inf.sheet}!${inf.rngF},"<>No contar")`, result: Math.round(v * 100) / 100 };
      c.numFmt = money; c.font = { italic: true };
    });
  });
  // Categorías: category x month, SUMIFS over the month sheets (only counted expenses)
  catWs.getCell('A1').value = 'Gastos por categoría y por mes (todas las personas, más los gastos con categoría de Ingresos y gastos)';
  catWs.getCell('A1').font = { bold: true, size: 14 };
  catWs.getCell('A3').value = 'Categoría'; style(catWs.getCell('A3'), head);
  keys.forEach((k, i) => { const c = catWs.getCell(3, 2 + i); c.value = mesN(k); style(c, head); c.alignment = { horizontal: 'center' }; });
  const cTot = 2 + keys.length;
  [['Total', cTot], ['Promedio/mes', cTot + 1]].forEach(([t, c]) => { catWs.getCell(3, c).value = t; style(catWs.getCell(3, c), head); });
  const sumaCat = (inf, cat) => inf.gs.filter(g => g.de !== NONE && (g.cat || '') === cat).reduce((a, g) => a + g.pesos + g.usd * (inf.mes.dolar || 0), 0);
  const fuera = (k, cat) => Math.round((((extra && extra.catFuera) || {})[k] || {})[cat] * 100 || 0) / 100;
  const listaCat = (st.categorias || []).concat(['']).filter(c => keys.some(k => sumaCat(info[k], c) || fuera(k, c)));
  listaCat.forEach((cat, i) => {
    const r = 4 + i;
    catWs.getCell(r, 1).value = cat || 'Sin categoría';
    let sum = 0;
    keys.forEach((k, j) => {
      const inf = info[k], extraMes = fuera(k, cat), v = Math.round((sumaCat(inf, cat) + extraMes) * 100) / 100; sum += v;
      const crit = cat ? `"${cat.replace(/"/g, '""')}"` : '"="';
      const c = catWs.getCell(r, 2 + j);
      c.value = { formula: `SUMIFS(${inf.sheet}!${inf.rngI},${inf.sheet}!${inf.rngK},${crit},${inf.sheet}!${inf.rngF},"<>No contar")${extraMes ? '+' + extraMes : ''}`, result: v };
      c.numFmt = money;
    });
    const a = catWs.getCell(r, 2).address, b = catWs.getCell(r, cTot - 1).address;
    catWs.getCell(r, cTot).value = { formula: `SUM(${a}:${b})`, result: sum };
    catWs.getCell(r, cTot + 1).value = { formula: `AVERAGE(${a}:${b})`, result: keys.length ? sum / keys.length : 0 };
    catWs.getCell(r, cTot).numFmt = catWs.getCell(r, cTot + 1).numFmt = money;
    catWs.getCell(r, cTot).font = { bold: true };
  });
  const crt = 4 + listaCat.length;
  catWs.getCell(crt, 1).value = 'Total'; catWs.getCell(crt, 1).font = { bold: true };
  for (let c = 2; c <= cTot + 1; c++) {
    const a = catWs.getCell(4, c).address, b = catWs.getCell(crt - 1, c).address;
    let v = 0; for (let r = 4; r < crt; r++) v += (catWs.getCell(r, c).value || {}).result || 0;
    const cell = catWs.getCell(crt, c);
    cell.value = { formula: `SUM(${a}:${b})`, result: v }; cell.numFmt = money; cell.font = { bold: true };
    cell.border = { top: { style: 'thin' } };
  }
  catWs.getColumn(1).width = 34;
  for (let c = 2; c <= cTot + 1; c++) catWs.getColumn(c).width = 16;

  res.getColumn(1).width = 22;
  for (let c = 2; c <= totCol; c++) res.getColumn(c).width = 16;
  return wb;
}
if (typeof module !== 'undefined') module.exports = { buildWorkbook };
